  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A new cat photo from The Cat API every day." />
    <title>Cat of the day — Vojtech Lahola</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=stacked-cat" />
    <link rel="stylesheet" href="cat.css?v=b985bac" />
    <script src="script.js" defer></script>
    <script src="cat.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Vojtech Lahola home">VL<span>.</span></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="sr-only">Toggle navigation</span>
        <span></span><span></span>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Main navigation">
        <a href="index.html#work">Work</a>
        <a href="cat.html" aria-current="page">Cat of the day</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </header>

    <main class="cat-page section-shell">
      <section class="cat-intro">
        <p class="eyebrow">Daily API experiment</p>
        <h1>Cat of the <em>day.</em></h1>
        <p>One new cat, selected for you each day. Come back tomorrow for another one.</p>
      </section>

      <section class="cat-card" aria-live="polite">
        <div class="cat-loading">
          <span class="loading-dot"></span>
          <p>Finding today’s cat...</p>
        </div>
        <img class="cat-image" alt="" />
        <div class="cat-details">
          <p class="cat-date"></p>
          <a class="text-link cat-source" href="#" target="_blank" rel="noreferrer">View original <span>↗</span></a>
        </div>
        <p class="cat-error" role="alert"></p>
        <button class="button button-primary retry-button" type="button">Try again <span>↻</span></button>
      </section>
    </main>

    <footer class="site-footer section-shell">
      <p>© <span id="current-year"></span> Vojtech Lahola</p>
      <a href="index.html">Back to portfolio ↗</a>
    </footer>
  </body>
